<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6F4E37">
  <title>Кофейня Красный Соловей</title>
  <link rel="manifest" href="manifest.json">
  <!-- Библиотека для QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #6F4E37;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      color: #333;
      border-radius: 24px;
      padding: 28px 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    }
    h1 { font-size: 22px; margin-bottom: 6px; color: #6F4E37; }
    .sub { font-size: 14px; color: #888; margin-bottom: 22px; }
    label { display: block; text-align: left; font-size: 13px; color: #666; margin-bottom: 6px; margin-top: 14px; }
    input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 17px;
      border: 2px solid #eee;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, input[type="tel"]:focus { border-color: #6F4E37; }
    
    /* Стили для галочки согласия */
    .checkbox-group {
      display: flex;
      align-items: flex-start;
      text-align: left;
      margin-top: 18px;
      margin-bottom: 15px;
    }
    .checkbox-group input[type="checkbox"] {
      width: auto;
      margin-top: 2px;
      margin-right: 10px;
      cursor: pointer;
      transform: scale(1.2);
    }
    .checkbox-group label {
      margin: 0;
      font-size: 12px;
      color: #666;
      line-height: 1.3;
      cursor: pointer;
      font-weight: normal;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 5px;
      font-size: 17px;
      font-weight: 600;
      color: #fff;
      background: #6F4E37;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s, background-color 0.2s;
    }
    button:active { opacity: 0.8; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    
    #qrScreen { display: none; }
    
    /* Контейнер под QR-код */
    #qrBox {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 18px auto;
      padding: 16px;
      background: #fff;
      border-radius: 16px;
      width: 292px; 
      height: 292px;
    }
    
    .phone-big { font-size: 20px; font-weight: 600; color: #6F4E37; letter-spacing: 1px; margin-top: 15px; }
    
    /* Стили для подсказки установки */
    #installHint {
      display: none;
      background: #f9f5f0;
      border: 1px solid #e0d6cc;
      border-radius: 12px;
      padding: 15px;
      margin-top: 20px;
      font-size: 13px;
      color: #6F4E37;
      text-align: left;
      line-height: 1.5;
    }
    #installHint b { color: #4a3222; }

    .hint { font-size: 13px; color: #888; margin-top: 14px; line-height: 1.4; }
    .reset {
      margin-top: 18px;
      font-size: 13px;
      color: #aaa;
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
    }
    .brightness-tip {
      font-size: 12px;
      color: #aaa;
      margin-top: 10px;
    }
    .loader {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <!-- Экран регистрации -->
    <div id="regScreen">
      <h1>☕ Добро пожаловать</h1>
      <p class="sub">Введите номер телефона, чтобы получить карту лояльности</p>

      <label for="name">Имя</label>
      <input type="text" id="name" placeholder="Как вас зовут?" autocomplete="name">

      <label for="phone">Номер телефона</label>
      <input type="tel" id="phone" placeholder="+7 (___) ___-__-__" autocomplete="tel" inputmode="tel" maxlength="18">

      <!-- Галочка согласия -->
      <div class="checkbox-group">
        <input type="checkbox" id="agreeCheckbox">
        <label for="agreeCheckbox">Я согласен на обработку персональных данных</label>
      </div>

      <button id="submitBtn" onclick="saveAndShow()" disabled>Получить карту</button>
      <p class="hint">Номер нужен только для того, чтобы кассир мог найти вас в системе лояльности.</p>
    </div>

    <!-- Экран с картой -->
    <div id="qrScreen">
      <h1>Ваша карта</h1>
      <p class="sub">Покажите этот код кассиру</p>

      <div id="qrBox"></div>
      <div class="phone-big" id="phoneDisplay"></div>
      
      <!-- Блок для умной подсказки -->
      <div id="installHint"></div>

      <p class="brightness-tip">Увеличьте яркость экрана для сканирования</p>

      <button class="reset" onclick="resetCard()">Изменить номер</button>
    </div>
  </div>

  <script>
    // === НАСТРОЙКА ===
    // Вставьте сюда вашу ссылку из Google Apps Script
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw_Ex_WQCmqxzqHmLru9XRYYIlQaezEruxA_80_-mEgScrkFdOSN3V6O8u6v9kMQTpT/exec';

    // === ЛОГИКА ===
    
    // 1. Логика галочки согласия
    const agreeCheckbox = document.getElementById('agreeCheckbox');
    const submitBtn = document.getElementById('submitBtn');

    agreeCheckbox.addEventListener('change', function() {
      // Если галочка стоит, кнопка становится активной (disabled = false)
      submitBtn.disabled = !this.checked; 
    });

    // 2. Маска для телефона
    const phoneInput = document.getElementById('phone');
    phoneInput.addEventListener('input', function (e) {
      let input = e.target.value.replace(/\D/g, ''); 
      if (!input) {
        e.target.value = '';
        return;
      }
      
      if (input[0] === '8') input = '7' + input.slice(1);
      if (input[0] !== '7') input = '7' + input;

      let formatted = '+7 ';
      if (input.length > 1) formatted += '(' + input.substring(1, 4);
      if (input.length >= 5) formatted += ') ' + input.substring(4, 7);
      if (input.length >= 8) formatted += '-' + input.substring(7, 9);
      if (input.length >= 10) formatted += '-' + input.substring(9, 11);

      e.target.value = formatted;
    });

    function saveAndShow() {
      // Проверка на случай обхода блокировки кнопки
      if (!agreeCheckbox.checked) {
        alert('Пожалуйста, согласитесь на обработку персональных данных');
        return;
      }

      const name = document.getElementById('name').value.trim();
      const phoneRaw = document.getElementById('phone').value.trim();
      const btn = document.getElementById('submitBtn');

      let digits = phoneRaw.replace(/\D/g, '');
      
      if (digits.length !== 11) {
        alert('Пожалуйста, введите номер полностью (11 цифр).');
        return;
      }

      const finalPhone = '+' + digits; 

      btn.disabled = true;
      btn.innerHTML = '<span class="loader"></span> Сохраняем...';

      // Отправляем в Google
      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name || 'Без имени', phone: finalPhone })
      }).catch((error) => {
        console.error('Ошибка отправки:', error);
      }).finally(() => {
        localStorage.setItem('loyalty_name', name);
        localStorage.setItem('loyalty_phone', finalPhone);
        showQR(finalPhone);
        btn.disabled = false;
        btn.innerHTML = 'Получить карту';
      });
    }

    function showQR(phoneNumber) {
      document.getElementById('regScreen').style.display = 'none';
      document.getElementById('qrScreen').style.display = 'block';
      document.getElementById('phoneDisplay').textContent = phoneNumber;

      const qrBox = document.getElementById('qrBox');
      qrBox.innerHTML = ''; // Очищаем контейнер

      // Генерация QR-кода
      new QRCode(qrBox, {
        text: phoneNumber,
        width: 260,
        height: 260,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });

      // Показываем подсказку для установки
      showInstallHint();
    }

    // === Умная подсказка для установки ===
    function showInstallHint() {
      // Проверяем, не запущено ли уже как приложение (на главном экране)
      if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
        return; // Уже установлено, ничего не показываем
      }

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      const hintBlock = document.getElementById('installHint');
      
      if (isIOS) {
        hintBlock.innerHTML = '📱 <b>Сохранить карту на iPhone:</b><br>Нажмите кнопку <b>«Поделиться»</b> (квадрат со стрелкой вверх) внизу экрана и выберите <b>«На экран "Домой"»</b>.';
        hintBlock.style.display = 'block';
      } else {
        // Для Android и других
        hintBlock.innerHTML = '📱 <b>Сохранить карту на телефон:</b><br>Нажмите на <b>три точки</b> (или меню) в углу браузера и выберите <b>«Добавить на главный экран»</b> или <b>«Установить приложение»</b>.';
        hintBlock.style.display = 'block';
      }
    }

    function resetCard() {
      if (!confirm('Удалить сохранённый номер с этого телефона?')) return;
      localStorage.removeItem('loyalty_name');
      localStorage.removeItem('loyalty_phone');
      document.getElementById('qrScreen').style.display = 'none';
      document.getElementById('regScreen').style.display = 'block';
      document.getElementById('phone').value = '';
      document.getElementById('name').value = '';
      document.getElementById('installHint').style.display = 'none'; // Скрываем подсказку
      
      // Сбрасываем галочку и блокируем кнопку обратно
      agreeCheckbox.checked = false;
      submitBtn.disabled = true;
    }

    // При загрузке проверяем сохраненный номер
    window.addEventListener('DOMContentLoaded', () => {
      const savedPhone = localStorage.getItem('loyalty_phone');
      if (savedPhone) {
        showQR(savedPhone);
      }
    });
  </script>
</body>
</html>
